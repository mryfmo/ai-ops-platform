packages:
  - "packages/*"

# Transitive advisories with no direct dependency to bump. Each selector is
# pinned to its own major so a security patch cannot pull a breaking release.
overrides:
  "postcss@8": "^8.5.19"
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "fast-uri@3": "^3.1.6"
  "ip-address@10": "^10.3.1"
  "sharp@0.34": "^0.35.0"
  "@auth/core@0": "^0.41.3"
  "nanoid@3": "^3.3.18"

# These exact versions were reviewed and merged before pnpm 11 enabled its
# 24-hour supply-chain hold. Future versions remain subject to the hold.
minimumReleaseAgeExclude:
  - "@anthropic-ai/claude-agent-sdk@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.210"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.210"

allowBuilds:
  esbuild: true
  sharp: true
  msw: false
  protobufjs: false
  "@swc/core": false
