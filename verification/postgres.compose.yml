# DevOps REQ-028 / SPEC-INT-056: disposable PostgreSQL for Plan 001 only.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiops_p001
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aiops_p001"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
