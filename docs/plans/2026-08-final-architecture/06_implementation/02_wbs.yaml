schema_version: '1.0'
baseline_commit: 49e2e3c0a3a9d30be46b2a3ae0727009d9eec324
one_writer_per_task: true
phases:
- id: P0
  name: Baseline and governance
  exit_intent: No code migration starts until branch protection, baseline evidence, ADRs and environment decisions are approved.
- id: P1
  name: Contracts and scaffolding
  exit_intent: Create versioned contracts, packages, ledgers and CI fitness gates without changing production traffic.
- id: P2
  name: LiteLLM inference plane
  exit_intent: Introduce Bedrock/Anthropic routing behind logical aliases and migrate all LLM consumers.
- id: P3
  name: Temporal control plane
  exit_intent: Move scheduling, retries, approvals and long-running state into durable workflows.
- id: P4
  name: agentgateway and OPA
  exit_intent: Centralize MCP/A2A access and cross-system policy enforcement.
- id: P5
  name: Work IQ and Graph
  exit_intent: Add delegated M365 intelligence while retaining Graph deterministic/system paths.
- id: P6
  name: Meeting and knowledge
  exit_intent: Implement Wispr-to-review-to-Plane/GitHub/Confluence/SharePoint flows.
- id: P7
  name: Teams and Web Workbench
  exit_intent: Add OpenTag-derived Teams UX and capability-scoped workspace UI.
- id: P8
  name: AI coding agents
  exit_intent: Enable Claude Code, Droid and independent Codex review through isolated PR-only runners.
- id: P9
  name: AIOps and observability
  exit_intent: Correlate telemetry, incident workflows, RCA and repair PRs.
- id: P10
  name: Infrastructure and release
  exit_intent: Implement Azure deployment, security, DR, load and go-live gates.
