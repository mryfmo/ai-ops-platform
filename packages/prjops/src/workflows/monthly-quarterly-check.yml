name: prjops-monthly-quarterly-check
# 根拠: SPEC-INT-040「毎日00:00 JSTに判定ジョブを走らせ、『第1営業日』『初月第3営業日』に該当する
#   日のみ本処理を実行する」（00:00 JST = 前日15:00 UTC）
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch: {}

jobs:
  check-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiops/shared --filter @aiops/prjops run build
      - name: 第1営業日/第3営業日判定 + 該当時のみ月次/四半期処理を実行
        run: node packages/prjops/scripts/jobs/monthly-quarterly-check.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          PRJOPS_DATA_REPO_TOKEN: ${{ secrets.PRJOPS_DATA_REPO_TOKEN }}
