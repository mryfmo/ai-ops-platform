name: prjops-track-daily
# 根拠: SPEC-INT-040（平日09:00 JST = 平日00:00 UTC。祝日は営業日カレンダーでスキップ）/ REQ-009
on:
  schedule:
    - cron: "0 0 * * MON-FRI"
  workflow_dispatch: {}

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiops/shared --filter @aiops/prjops run build
      - name: AGT-06 track-daily (祝日は calendar/jp_holidays.yaml でスキップ判定)
        run: node packages/prjops/scripts/jobs/track-daily.mjs
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          PRJOPS_DATA_REPO_TOKEN: ${{ secrets.PRJOPS_DATA_REPO_TOKEN }}
