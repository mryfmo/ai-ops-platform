name: devops-reports
# 根拠: SPEC-INT-033「毎営業日08:30 JSTに集計バッチ開始、09:00 JST配信」。週次は月曜、月次は第1営業日。
on:
  schedule:
    - cron: "30 23 * * SUN-THU"
  workflow_dispatch:
    inputs:
      frequency:
        description: "daily | weekly | monthly"
        required: false
        default: "daily"

jobs:
  generate-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aiops/shared --filter @aiops/devops run build
      - name: AGT-RPT 日次/週次/月次判定+配信（REQ-020〜024）
        run: node packages/devops/scripts/jobs/reports.mjs --frequency=${{ inputs.frequency || 'daily' }}
        env:
          GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
          GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
          GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
          DATABASE_URL: ${{ secrets.DEVOPS_DATABASE_URL }}
