# 根拠: REQ-032 / DevOps REQ-030（gitleaks 秘密情報検知, DEV-10）。
# 秘密情報サニタイザの検証には意図的な偽トークンを fixture として持つ必要があるため、
# 当該テストファイルのみ allowlist する。実コード・他テストの秘密は既定ルールで検知継続。
title = "ai-ops-platform gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Intentional fake tokens in secret-redaction test fixtures"
paths = [
  '''packages/shared/tests/secretSanitizer\.test\.ts''',
  '''packages/server/tests/freeTextIntent\.test\.ts''',
  '''packages/server/tests/pmTimeseriesRepo\.test\.ts''',
]

[[allowlists]]
description = "Intentional fake generic API key in dead-letter reason sanitizer test fixture"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''packages/server/tests/eventsRepoDeadLetter\.test\.ts''']
regexes = ['''^\s*const secret = "api_key=abcdefghijklm[n]opqrstuvwx";$''']

[[allowlists]]
description = "Workflow business-key fixture in P1-T05 ledger repo tests (generic-api-key false positive on the businessKey field name)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''packages/server/tests/p1LedgerRepos\.test\.ts''']
regexes = ['''^\s*businessKey: "[0-9A-Za-z._:-]+",$''']

[[allowlists]]
description = "Intentional fake api_key fixture proving MeetingArtifactsRepo sanitizes external JSON before storage (P1-T05)"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = [
  '''packages/server/tests/p1LedgerRepos\.test\.ts''',
  '''packages/server/tests/p1LedgerPg\.test\.ts''',
]
regexes = ['''api_key=abcdefghijklm[n]opqrstuvwx''']
