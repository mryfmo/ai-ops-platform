# AUD-OPS-002: machine-readable alerts for runbooks/observability-slo.md.
groups:
  - name: aiops-slos
    rules:
      - alert: AiOpsIngestToDispatchLatency
        expr: aiops_events_queue_oldest_age_seconds{status="queued"} > 300
        for: 10m
        labels:
          slo: ingest-to-dispatch-latency
        annotations:
          summary: Queued events are older than the five-minute SLO
          runbook: runbooks/observability-slo.md

      # Every dead event has exhausted its retry budget, so the threshold is zero.
      # Five minutes avoids paging for one scrape while an operator completes a controlled requeue.
      - alert: AiOpsDeadLetterQueueNotEmpty
        expr: aiops_events_queue_depth{status="dead"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: One or more events exhausted their retry budget
          runbook: runbooks/manual-ops.md

      - alert: AiOpsReportDeliverySuccess
        expr: |
          sum(increase(aiops_report_delivery_total{result="failed"}[7d]))
          /
          sum(increase(aiops_report_delivery_total{result=~"sent|failed"}[7d]))
          > 0.01
        for: 30m
        labels:
          slo: report-delivery-success
        annotations:
          summary: Report delivery failure ratio exceeds the 1% error budget
          runbook: runbooks/observability-slo.md

      - alert: AiOpsSchedulerTaskSuccess
        expr: |
          sum by (task) (increase(aiops_task_failures_total[24h]))
          /
          sum by (task) (increase(aiops_task_run_duration_seconds_count[24h]))
          > 0.005
        for: 0m
        labels:
          slo: scheduler-task-success
        annotations:
          summary: A scheduler task's 24-hour success ratio is below 99.5%
          runbook: runbooks/observability-slo.md

      - alert: AiOpsReportDeliveryFastBurn
        expr: |
          sum(increase(aiops_report_delivery_total{result="failed"}[1h]))
          /
          sum(increase(aiops_report_delivery_total{result=~"sent|failed"}[1h]))
          > 0.06
        for: 0m
        labels:
          slo: report-delivery-success
          burn_rate: fast
        annotations:
          summary: Report delivery is consuming its 1% error budget at more than 6x over 1h
          runbook: runbooks/observability-slo.md

      - alert: AiOpsReportDeliverySlowBurn
        expr: |
          sum(increase(aiops_report_delivery_total{result="failed"}[3d]))
          /
          sum(increase(aiops_report_delivery_total{result=~"sent|failed"}[3d]))
          > 0.01
        for: 0m
        labels:
          slo: report-delivery-success
          burn_rate: slow
        annotations:
          summary: Report delivery is consuming its 1% error budget at more than 1x over 3d
          runbook: runbooks/observability-slo.md
