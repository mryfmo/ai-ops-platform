# 根拠: FinalArch:MCP-001 / FinalArch:MCP-004 / FinalArch:FR-MCP-001..007 / ADR-0023 / WBS P4-T02
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://aiops.internal/contracts/tools/mcp-registry/v1
type: object
additionalProperties: false
required: [schema_version, schema_hash, entries]
properties:
  schema_version:
    const: "1.0"
  schema_hash:
    type: string
    pattern: "^[0-9a-f]{64}$"
  entries:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - enabled
        - protocol
        - transport
        - owner
        - version
        - risk
        - operations
        - resources
        - auth
        - allowed_callers
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
        enabled:
          type: boolean
        protocol:
          const: mcp
        transport:
          const: streamable-http
        owner:
          enum: [ai-coe, devops, prjops, knowledge, m365]
        version:
          const: pinned
        risk:
          enum: [L0, L1, L2, L3, L4, L5, L6]
        operations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
        resources:
          type: string
          minLength: 1
        auth:
          enum: [oauth, github-app-or-oauth, oauth-or-dedicated-integration, delegated-obo]
        allowed_callers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [control-plane, claude-runner, droid-runner]
        endpoint:
          type: object
          additionalProperties: false
          required: [host, port, path]
          properties:
            host:
              type: string
              pattern: "^[A-Za-z0-9](?:[A-Za-z0-9.-]*[A-Za-z0-9])?$"
            port:
              type: integer
              minimum: 1
              maximum: 65535
            path:
              type: string
              pattern: '^/\S*$'
      allOf:
        - if:
            properties:
              enabled:
                const: true
            required: [enabled]
          then:
            required: [endpoint]
