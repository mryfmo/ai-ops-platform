# 根拠: FinalArch:PRD-010 / FinalArch:FR-CP-008 / ADR-0029 / REL-003 / WBS P10-T05
name: release-image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase commit SHA to build
        required: true
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: release-litellm-${{ inputs.source_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate checked-out source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          unset-current-credentials: true

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Bind immutable release name
        id: release
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY_URI: ${{ vars.LITELLM_ECR_REPOSITORY_URI }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_URI" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9][a-z0-9._/-]+$ ]]
          case "$REPOSITORY_URI" in
            "$ECR_REGISTRY"/*) ;;
            *) echo "repository is outside the authenticated ECR registry" >&2; exit 1 ;;
          esac
          echo "image-tag=${REPOSITORY_URI}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable SHA tag
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/litellm/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.release.outputs.image-tag }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Record immutable digest
        id: digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY_URI: ${{ vars.LITELLM_ECR_REPOSITORY_URI }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${REPOSITORY_URI}@${IMAGE_DIGEST}"
          mkdir -p release
          printf '%s\n' "$image_ref" > release/image-ref.txt
          jq -n --arg sourceSha "$SOURCE_SHA" --arg imageRef "$image_ref" --arg digest "$IMAGE_DIGEST" \
            '{schemaVersion:1,sourceSha:$sourceSha,imageRef:$imageRef,digest:$digest}' > release/manifest.json
          echo "image-ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image-ref=${image_ref}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SPDX SBOM for exact digest
        id: sbom
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.digest.outputs.image-ref }}
          format: spdx-json
          output-file: release/sbom.spdx.json
          syft-version: v1.51.0
          dependency-snapshot: false
          upload-artifact: false

      - name: Install verified cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign exact digest with GitHub OIDC
        id: sign
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image-ref }}
        run: cosign sign --yes "$IMAGE_REF"

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ vars.LITELLM_ECR_REPOSITORY_URI }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: litellm-release-${{ inputs.source_sha }}
          path: |
            release/
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 30
