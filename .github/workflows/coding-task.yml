# .github/workflows/coding-task.yml
#
# 根拠: ADR-0006決定1「コーディングタスクの実行環境はGitHub Actionsランナーとする」。
#   POST /coding-tasks/:taskId/confirm（packages/server/src/http/routes/codingTasks.ts）が
#   人間の明示クリックを受理した後にのみ workflow_dispatch で起動される
#   （runbooks/coding-task-failure.md の手動dispatchコマンド例と入力名を一致させること:
#    `gh workflow run coding-task.yml -f task_id=<ID> -f instruction="<指示>" -f base_ref=main`）。
#
# 実行フロー:
#   1. base_refをcheckout
#   2. agent/{task_id} ブランチを作成
#   3. .github/actions/run-coding-agent でコーディングエージェントを実行
#   4. 変更があればcommit+push、PR作成（[AI] プレフィックス + ai-generatedラベル、AC-002b）
#      変更が無ければジョブをスキップし、statusをcancelledでcallbackする
#   5. 成功/失敗いずれの場合もPOST /internal/coding-tasks/:taskId/callback で
#      coding_tasks台帳へ結果を反映する（Bearer認証, CODING_TASK_CALLBACK_SECRET）
#
# 必要なsecrets（GitHub Organization/Repository Settings側で登録すること）:
#   - PUBLIC_BASE_URL: 常駐サーバの公開FQDN（callback送信先。config.tsと同一値）
#   - CODING_TASK_CALLBACK_SECRET: callback認証用Bearerトークン（config.tsと同一値）
#   - AIOPS_PR_TOKEN: PR作成/branch push用。GitHub App installation token または専用PAT。
#     contents:write / pull-requests:write / issues:write が必要。未設定なら明示失敗する。
#   - ANTHROPIC_API_KEY: run-coding-agent の input として渡す（ADR-0006影響節）。
#     step env にすると composite action の全ステップが継承するため input 経由にしている。
#     FACTORY_API_KEY は agent=droid が ADR-0006 の残課題で無効のため現時点では未使用。
#
# 検証状況: 本ワークフローはworkflow_dispatchでのみ起動される。静的検証（actionlint）は
#   green で、CLIはバージョン固定して導入するため `command not found` では落ちない。
#   ただし実際のディスパッチ実行（実 ANTHROPIC_API_KEY / AIOPS_PR_TOKEN でのエージェント
#   実行・push・PR作成・callback）は未実施であり、go-live 前に1周する必要がある。
#   agent=droid は ADR-0006 の残課題のため明示的に失敗する。
name: coding-task

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "coding_tasks.task_id（UUID）"
        required: true
        type: string
      project_id:
        description: "対象プロジェクトID（PJ-nnn）"
        required: true
        type: string
      instruction:
        description: "コーディング指示内容"
        required: true
        type: string
      base_ref:
        description: "ベースブランチ"
        required: false
        type: string
        default: main
      agent:
        description: "実行エージェント（claude-code | droid）"
        required: true
        type: choice
        options:
          - claude-code
          - droid
        default: claude-code

permissions:
  contents: read

env:
  BRANCH_NAME: agent/${{ inputs.task_id }}

jobs:
  run-coding-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: coding-task-${{ inputs.task_id }}
    steps:
      - name: Require CI-triggering PR token
        env:
          AIOPS_PR_TOKEN: ${{ secrets.AIOPS_PR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${AIOPS_PR_TOKEN:-}" ]; then
            echo "::error::AIOPS_PR_TOKEN is required so AI-created PRs trigger ci.yml. See runbooks/production-gates.md."
            exit 1
          fi

      # persist-credentials: false は必須。既定の true だと AIOPS_PR_TOKEN が
      # .git/config に残り、後段で acceptEdits のエージェントが編集した
      # .git/hooks/* が commit 時に実行されると、そのトークンで任意の push が
      # 成立する。push は専用ステップで都度認証する。
      - name: Checkout base_ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.base_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.13.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create agent branch
        run: |
          set -euo pipefail
          git config user.name "aiops-coding-agent[bot]"
          git config user.email "aiops-coding-agent[bot]@users.noreply.github.com"
          # エージェントは acceptEdits で任意のファイルを編集できるため、
          # .git/hooks/* を書かれても実行されないようにしておく。
          git config core.hooksPath /dev/null
          git checkout -b "${BRANCH_NAME}"
          # エージェント実行前の .git/config を退避する。insteadOf 等の書き換えを
          # 仕込まれるとトークン付きpushの宛先を差し替えられるため、push直前に戻す。
          cp .git/config "${RUNNER_TEMP}/git-config.trusted"

      # 秘密はstep envではなくinputで渡す。step envにするとcomposite action内の
      # 全ステップ（CLI導入を含む）が継承し、依存のlifecycle scriptから見えてしまう。
      - name: Run coding agent (ADR-0006 composite action)
        uses: ./.github/actions/run-coding-agent
        with:
          agent: ${{ inputs.agent }}
          instruction: ${{ inputs.instruction }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # git add はclean filterを、commit はhookを走らせ得る。いずれもエージェントが
      # 直前に .gitattributes / .git/config へ仕込める。したがってこのステップには
      # トークンを渡さない。トークンを持つのは次のpushステップだけにする。
      - name: Commit changes (no token in scope)
        if: steps.detect.outputs.changed == 'true'
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          TASK_ID: ${{ inputs.task_id }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          # エージェントはこのステップより前に走っており、branch作成時に設定した
          # core.hooksPath を書き戻せるため再度無効化する。
          git config core.hooksPath /dev/null
          git add -A
          git commit --no-verify -m "[AI] ${PROJECT_ID}: ${INSTRUCTION}" -m "task_id: ${TASK_ID}"

      - name: Push agent branch
        if: steps.detect.outputs.changed == 'true'
        env:
          AIOPS_PR_TOKEN: ${{ secrets.AIOPS_PR_TOKEN }}
        run: |
          set -euo pipefail
          # エージェントが書き換えた可能性のある .git/config を、実行前の状態へ戻す。
          # url.<base>.insteadOf などはURLを使用前に書き換えるため、明示URLと
          # credential helper だけでは宛先の差し替えを防げない。
          cp "${RUNNER_TEMP}/git-config.trusted" .git/config
          git config core.hooksPath /dev/null
          # AC-002b: mainへの直接pushはしない。agent/{task_id}ブランチへのpushのみ許可する。
          # トークンはURL（=argv）に置かず、環境変数から読むcredential helperで渡す。
          # URLに埋めると同一ランナー上の他プロセスからprocのargvとして読める。
          # 認証設定は -c で当該コマンド限りに閉じ、.git/config には残さない。
          # --no-verify: pre-push hook がこのステップの AIOPS_PR_TOKEN を継承して
          # 意図しない参照へ push するのを防ぐ。
          git -c credential.helper= \
              -c "credential.helper=!f() { echo username=x-access-token; echo password=\$AIOPS_PR_TOKEN; }; f" \
              push --no-verify "https://github.com/${GITHUB_REPOSITORY}.git" "${BRANCH_NAME}"

      - name: Create pull request
        if: steps.detect.outputs.changed == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.AIOPS_PR_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id }}
          TASK_ID: ${{ inputs.task_id }}
          AGENT_NAME: ${{ inputs.agent }}
          INSTRUCTION: ${{ inputs.instruction }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          PR_BODY_FILE="$(mktemp)"
          {
            echo "## 概要"
            echo "AIコーディングエージェント（${AGENT_NAME}）による自動生成PRです（ADR-0006）。"
            echo ""
            echo "- task_id: ${TASK_ID}"
            echo "- project_id: ${PROJECT_ID}"
            echo "- 指示内容:"
            echo ""
            echo "${INSTRUCTION}"
            echo ""
            echo "マージには人間レビュアーの承認が必要です（CODEOWNERS + ブランチ保護）。"
          } > "${PR_BODY_FILE}"
          PR_URL=$(gh pr create \
            --title "[AI] ${PROJECT_ID}: ${INSTRUCTION}" \
            --body-file "${PR_BODY_FILE}" \
            --base "${BASE_REF}" \
            --head "${BRANCH_NAME}" \
            --label "ai-generated")
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      # security-reviewer指摘(中): callbackペイロードを文字列結合でJSON化していたため
      # jq --arg/--argjsonでの安全な組み立てに置き換える。github.run_idも他の値と同様に
      # env:経由にして`run:`シェル文字列へ`${{ }}`を直接埋め込まない原則を統一する。
      - name: Callback success (pr_created)
        if: success() && steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg status "pr_created" --arg prUrl "${PR_URL}" --arg branch "${BRANCH_NAME}" \
            --argjson workflowRunId "${RUN_ID}" \
            '{status: $status, prUrl: $prUrl, branch: $branch, workflowRunId: $workflowRunId}')
          curl -sS -X POST "${PUBLIC_BASE_URL}/internal/coding-tasks/${TASK_ID}/callback" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CODING_TASK_CALLBACK_SECRET }}
          TASK_ID: ${{ inputs.task_id }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          RUN_ID: ${{ github.run_id }}

      - name: Callback cancelled (no changes produced)
        if: success() && steps.detect.outputs.changed == 'false'
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg status "cancelled" --argjson workflowRunId "${RUN_ID}" \
            '{status: $status, workflowRunId: $workflowRunId}')
          curl -sS -X POST "${PUBLIC_BASE_URL}/internal/coding-tasks/${TASK_ID}/callback" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CODING_TASK_CALLBACK_SECRET }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}

      - name: Callback failure
        if: failure()
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n --arg status "failed" --argjson workflowRunId "${RUN_ID}" \
            '{status: $status, workflowRunId: $workflowRunId}')
          curl -sS -X POST "${PUBLIC_BASE_URL}/internal/coding-tasks/${TASK_ID}/callback" \
            -H "Authorization: Bearer ${CALLBACK_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          CALLBACK_SECRET: ${{ secrets.CODING_TASK_CALLBACK_SECRET }}
          TASK_ID: ${{ inputs.task_id }}
          RUN_ID: ${{ github.run_id }}
