name: ci
# このリポジトリ自体（ai-ops-platform モノレポ）のCI。
# 根拠: REQ-032/DevOps REQ-030（gitleaksによる秘密情報検知, DEV-10）、
#       DOC-05 §11「実装完了の定義: 対応するREQのACを検証するテストが存在し合格していること」、
#       FinalArch:CON-001 / FinalArch:GOV-004 / FinalArch:GOV-005 / ADR-0020
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The repository ships real-PostgreSQL tests (schema, migrations, recipient
    # backfill, pool saturation) plus verification/run_db_integration.sh. Without
    # a database they silently skip, so the layer whose regressions hurt most was
    # never exercised in CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      AIOPS_TEST_DATABASE_NAME: aiops_test
      AIOPS_TEST_DATABASE_HOST: 127.0.0.1
      AIOPS_TEST_DATABASE_PORT: "5432"
      AIOPS_LOAD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aiops_load_test
      AIOPS_LOAD_TEST_CONFIRM_DATABASE: aiops_load_test
      OPA_VERSION: "1.19.0"
      OPA_LINUX_AMD64_SHA256: "1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Architecture fitness remains in governance:check; migration idempotency remains in the PostgreSQL integration step below.
      - run: pnpm run governance:check
      - run: pnpm install --frozen-lockfile
      - name: sha256-pinned OPAを導入
        run: |
          set -euo pipefail
          asset="opa_linux_amd64_static"
          curl -fsSLO "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/${asset}"
          echo "${OPA_LINUX_AMD64_SHA256}  ${asset}" | sha256sum -c -
          install -m 0755 "${asset}" "${RUNNER_TEMP}/opa"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: OPA policy gate (FinalArch:CON-001 / GOV-004)
        run: mise run policy:rego
      - name: Contract gate (FinalArch:CON-001 / GOV-005)
        run: mise run contracts
      - name: 実DBテスト用データベースを作成
        run: |
          set -euo pipefail
          createdb aiops_load_test
          createdb aiops_p001
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run lint
      - run: pnpm run format
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run test:coverage
      - name: TH-001 coverage evidenceを決定的JSONへ集約
        env:
          EVIDENCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node --input-type=module -e '
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const packages = ["devops", "prjops", "server", "shared", "web"];
          const summaries = packages.map((name) => {
            const path = `packages/${name}/coverage/coverage-summary.json`;
            if (!existsSync(path)) throw new Error(`missing coverage summary: ${path}`);
            const lines = JSON.parse(readFileSync(path, "utf8")).total?.lines;
            if (!lines || !Number.isInteger(lines.covered) || !Number.isInteger(lines.total)) throw new Error(`invalid coverage summary: ${path}`);
            return { name, covered: lines.covered, total: lines.total };
          });
          const covered = summaries.reduce((sum, item) => sum + item.covered, 0);
          const total = summaries.reduce((sum, item) => sum + item.total, 0);
          if (summaries.length === 0 || total === 0 || !/^[0-9a-f]{40}$/.test(process.env.EVIDENCE_COMMIT_SHA ?? "")) throw new Error("coverage evidence is incomplete");
          const evidence = { schemaVersion: 1, commitSha: process.env.EVIDENCE_COMMIT_SHA, unitTestCoveragePct: Number((covered * 100 / total).toFixed(2)), packages: summaries };
          mkdirSync(".ci", { recursive: true });
          writeFileSync(".ci/agt-dep-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`);
          '
      - name: TH-001 coverage evidence artifactを発行
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agt-dep-th001-evidence
          path: .ci/agt-dep-evidence.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: トレーサビリティ検証（全SPEC-ID⇔実装⇔テストの対応チェック）
        run: pnpm exec tsx packages/traceability/src/verifyTraceability.ts
      - name: PostgreSQL統合検証（追記専用・パーティション・migration冪等性）
        env:
          P001_ALLOW_DISPOSABLE_DB: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aiops_p001
        run: bash verification/run_db_integration.sh

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks secret scan (DEV-10, REQ-032)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${asset}" | sha256sum -c -
          tar -xzf "${asset}" gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
