# 根拠: FinalArch:PRD-008 / FinalArch:FR-AGT-001..006 / FinalArch:COD-006 / ADR-0027 / WBS P8-T06
name: coding-task-review

on:
  workflow_dispatch:
    inputs:
      task_manifest_path:
        description: "Review target 内の P8-T01 task manifest path"
        required: true
        type: string
      manifest_digest:
        description: "Dispatch authority が固定した manifest raw-byte SHA-256"
        required: true
        type: string
      base_sha:
        description: "Review range の base commit SHA"
        required: true
        type: string
      head_sha:
        description: "Review range の head commit SHA"
        required: true
        type: string
      reviewer_agent_id:
        description: "Orchestrator が割り当てた reviewer agent_id"
        required: true
        type: string
      reviewer_execution_profile:
        description: "Orchestrator が割り当てた reviewer execution_profile"
        required: true
        type: string

permissions:
  contents: read

jobs:
  independent-review:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout review target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0
          path: review-target
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.13.0"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install trusted contract validator
        run: pnpm --dir contracts install --frozen-lockfile --ignore-scripts

      - name: Collect and validate review evidence
        env:
          TARGET_ROOT: review-target
          TASK_MANIFEST_PATH: ${{ inputs.task_manifest_path }}
          MANIFEST_DIGEST: ${{ inputs.manifest_digest }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEWER_AGENT_ID: ${{ inputs.reviewer_agent_id }}
          REVIEWER_EXECUTION_PROFILE: ${{ inputs.reviewer_execution_profile }}
          FINDINGS_PATH: ${{ runner.temp }}/codex-review-findings.json
        run: >-
          node scripts/collect-agent-review.mjs
          --target "$TARGET_ROOT"
          --manifest "$TASK_MANIFEST_PATH"
          --manifest-digest "$MANIFEST_DIGEST"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --reviewer "$REVIEWER_AGENT_ID"
          --profile "$REVIEWER_EXECUTION_PROFILE"
          --output "$FINDINGS_PATH"

      - name: Upload structured findings
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-review-findings
          path: ${{ runner.temp }}/codex-review-findings.json
          if-no-files-found: error
          retention-days: 14
