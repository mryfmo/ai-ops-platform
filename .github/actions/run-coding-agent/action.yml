# .github/actions/run-coding-agent/action.yml
#
# 根拠: ADR-0006決定1「実行はcomposite action化し、agentパラメータ（claude-code | droid）で
#   差し替え可能にする」。.github/workflows/coding-task.yml から呼ばれる。
#
# 実行前提: CLIはこのaction内でバージョン固定して導入する。導入ステップが無いと
#   `claude: command not found` で必ず失敗するため、リポジトリの他の依存と同じく
#   exact versionで固定する。
name: "run-coding-agent"
description: "AIコーディングエージェント（Claude Code / Droid）にinstructionを渡して実装させる（ADR-0006）"

inputs:
  agent:
    description: "実行エージェント（claude-code | droid）"
    required: true
  instruction:
    description: "コーディング指示内容（coding_tasks.instruction由来。sanitizeSecrets済みの想定）"
    required: true
  litellm_base_url:
    description: "agent=claude-code 実行用のLiteLLM gateway URL"
    required: false
    default: ""
  litellm_coding_virtual_key:
    description: "agent=claude-code 専用のLiteLLM virtual key。CLI導入ステップには渡さない"
    required: false
    default: ""
  execution_profile:
    description: "能力推定ではなく監査用の実行プロファイルラベル"
    required: false
    default: "claude-code-fable5-xhigh"
  max_runtime_seconds:
    description: "Claude Code processの実行秒数上限（P8-T03 lease以下）"
    required: false
    default: "1800"
  max_cost_usd:
    description: "Claude Code CLI側のcost上限（LiteLLM virtual key側でも別途強制）"
    required: false
    default: "25"
  max_tokens:
    description: "Claude Code API task全体のtoken上限"
    required: false
    default: "200000"
  max_tool_calls:
    description: "Claude Code CLIのagentic turn上限"
    required: false
    default: "500"

outputs:
  execution_profile:
    description: "監査用の実行プロファイルラベル"
    value: ${{ steps.run_claude.outputs.execution_profile || steps.run_droid.outputs.execution_profile }}
  evidence:
    description: "P8-T01 callback fieldsに準拠する構造化実行証跡JSON"
    value: ${{ steps.run_claude.outputs.evidence || steps.run_droid.outputs.evidence }}

runs:
  using: "composite"
  steps:
    - name: Require LiteLLM gateway credentials (agent=claude-code)
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.litellm_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.litellm_coding_virtual_key }}
      run: |
        set -euo pipefail
        if [ -z "${ANTHROPIC_BASE_URL:-}" ] || [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
          echo "::error::LITELLM_BASE_URL and LITELLM_CODING_VIRTUAL_KEY are required for agent=claude-code."
          exit 1
        fi

    # Native artifactをexact URL + SHA-256で検証してから配置する。package managerの
    # optionalDependency解決やpostinstallに未検証コードを委ねない。virtual keyは
    # このstepへ渡さず、後続の実行stepだけに閉じる。
    - name: Install verified Claude Code CLI (agent=claude-code)
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        CLAUDE_CODE_VERSION: "2.1.222"
        CLAUDE_CODE_LINUX_X64_SHA256: "6680125b6f3baab47c84797cbeb3196e343c61bb4679cae15d138041a325c1ff"
      run: |
        set -euo pipefail
        case "$(uname -s):$(uname -m)" in
          Linux:x86_64) ;;
          *) echo "::error::The pinned Claude Code artifact supports only the ubuntu-latest Linux x86_64 runner."; exit 1 ;;
        esac
        artifact="${RUNNER_TEMP}/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
        extract_dir="${RUNNER_TEMP}/claude-code-${CLAUDE_CODE_VERSION}"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "${artifact}" \
          "https://registry.npmjs.org/@anthropic-ai/claude-code-linux-x64/-/claude-code-linux-x64-${CLAUDE_CODE_VERSION}.tgz"
        echo "${CLAUDE_CODE_LINUX_X64_SHA256}  ${artifact}" | sha256sum -c -
        mkdir -p "${extract_dir}"
        tar --extract --gzip --file "${artifact}" --directory "${extract_dir}" --no-same-owner --no-same-permissions
        install -m 0755 "${extract_dir}/package/claude" "${RUNNER_TEMP}/claude"
        installed_version="$("${RUNNER_TEMP}/claude" --version)"
        if [[ "${installed_version}" != "${CLAUDE_CODE_VERSION} (Claude Code)"* ]]; then
          echo "::error::Installed Claude Code version does not match the reviewed pin."
          exit 1
        fi
        echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

    - name: Run bounded Claude Code (agent=claude-code)
      id: run_claude
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        CODING_INSTRUCTION: ${{ inputs.instruction }}
        EXECUTION_PROFILE: ${{ inputs.execution_profile }}
        MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds }}
        MAX_COST_USD: ${{ inputs.max_cost_usd }}
        MAX_TOKENS: ${{ inputs.max_tokens }}
        MAX_TOOL_CALLS: ${{ inputs.max_tool_calls }}
        ANTHROPIC_BASE_URL: ${{ inputs.litellm_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.litellm_coding_virtual_key }}
        ANTHROPIC_MODEL: "claude-code"
        ANTHROPIC_SMALL_FAST_MODEL: "claude-code"
      run: |
        set -euo pipefail
        if [[ "${EXECUTION_PROFILE}" != "claude-code-fable5-xhigh" ]]; then
          echo "::error::execution_profile must be the reviewed claude-code-fable5-xhigh label."
          exit 1
        fi
        if [[ ! "${MAX_RUNTIME_SECONDS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_RUNTIME_SECONDS > 1800 )); then
          echo "::error::max_runtime_seconds must be an integer between 1 and 1800."
          exit 1
        fi
        if ! jq -en --arg value "${MAX_COST_USD}" '$value | tonumber | select(. > 0 and . <= 25)' >/dev/null; then
          echo "::error::max_cost_usd must be a number greater than 0 and at most 25."
          exit 1
        fi
        if [[ ! "${MAX_TOKENS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_TOKENS > 200000 )); then
          echo "::error::max_tokens must be an integer between 1 and 200000."
          exit 1
        fi
        if [[ ! "${MAX_TOOL_CALLS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_TOOL_CALLS > 500 )); then
          echo "::error::max_tool_calls must be an integer between 1 and 500."
          exit 1
        fi
        current_branch="$(git symbolic-ref --quiet --short HEAD)" || {
          echo "::error::Claude Code requires a named agent/* branch."
          exit 1
        }
        case "${current_branch}" in
          agent/*) ;;
          *) echo "::error::Claude Code may run only on an agent/* PR branch."; exit 1 ;;
        esac

        echo "[run-coding-agent] launching profile=${EXECUTION_PROFILE} branch=${current_branch}"
        # virtual keyはLiteLLM側でclaude-code aliasだけを許可し、budget上限とexpiryを
        # 必ず設定する。provider credentialはrunnerへ渡さない。
        # dontAsk + explicit tool rulesにより未知のtool/commandは非対話で拒否する。
        # git commit/push・PR作成はcoding-task.yml側の資格分離済みstepだけが行う
        # （AC-002b: 自動マージはしない）。
        # 呼び出し側は checkout の persist-credentials: false と core.hooksPath=/dev/null で
        # 資格情報の残留とフック実行を封じている。
        evidence_schema='{"type":"object","additionalProperties":false,"required":["execution_profile","commands_executed","test_results","skipped_failed_checks","changed_paths","dependency_changes","security_findings","unresolved_decisions"],"properties":{"execution_profile":{"const":"claude-code-fable5-xhigh"},"commands_executed":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["command","result","evidence"],"properties":{"command":{"type":"string"},"result":{"enum":["pass","fail"]},"evidence":{"type":"string"}}}},"test_results":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["test","result","evidence"],"properties":{"test":{"type":"string"},"result":{"enum":["pass","fail"]},"evidence":{"type":"string"}}}},"skipped_failed_checks":{"type":"array","items":{"type":"string"}},"changed_paths":{"type":"array","items":{"type":"string"}},"dependency_changes":{"type":"array","items":{"type":"string"}},"security_findings":{"type":"array","items":{"type":"string"}},"unresolved_decisions":{"type":"array","items":{"type":"string"}}}}'
        result_file="${RUNNER_TEMP}/claude-code-result-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}.json"
        trap 'rm -f "${result_file}"' EXIT
        timeout --signal=TERM --kill-after=30s "${MAX_RUNTIME_SECONDS}s" \
          claude -p "${CODING_INSTRUCTION}" \
          --model "${ANTHROPIC_MODEL}" \
          --effort xhigh \
          --permission-mode dontAsk \
          --safe-mode \
          --no-chrome \
          --disable-slash-commands \
          --no-session-persistence \
          --strict-mcp-config \
          --mcp-config '{"mcpServers":{}}' \
          --tools "Read,Edit,Write,Glob,Grep,Bash" \
          --allowedTools \
            "Read" "Edit" "Write" "Glob" "Grep" \
            "Bash(git status *)" "Bash(git diff *)" "Bash(git log *)" \
            "Bash(git show *)" "Bash(git grep *)" "Bash(git rev-parse *)" \
            "Bash(git ls-files *)" "Bash(rg *)" "Bash(node --test *)" \
            "Bash(pnpm run *)" "Bash(pnpm --filter * run *)" "Bash(mise run *)" \
          --disallowedTools \
            "WebFetch" "WebSearch" \
            "Bash(curl *)" "Bash(wget *)" "Bash(gh *)" "Bash(ssh *)" "Bash(scp *)" "Bash(rsync *)" \
            "Bash(git push *)" "Bash(git commit *)" "Bash(git tag *)" "Bash(git merge *)" \
            "Bash(git rebase *)" "Bash(git reset *)" \
            "Bash(aws *)" "Bash(kubectl *)" "Bash(terraform *)" "Bash(helm *)" \
            "Bash(docker *)" "Bash(podman *)" \
            "Bash(pnpm add *)" "Bash(pnpm install *)" "Bash(pnpm publish *)" "Bash(npm *)" "Bash(npx *)" \
          --max-budget-usd "${MAX_COST_USD}" \
          --task-budget "${MAX_TOKENS}" \
          --max-turns "${MAX_TOOL_CALLS}" \
          --output-format json \
          --json-schema "${evidence_schema}" > "${result_file}"

        evidence="$(jq -ce --arg profile "${EXECUTION_PROFILE}" \
          '.structured_output | select(.execution_profile == $profile)' "${result_file}")" || {
          echo "::error::Claude Code did not return valid structured callback evidence."
          exit 1
        }
        echo "execution_profile=${EXECUTION_PROFILE}" >> "${GITHUB_OUTPUT}"
        echo "evidence=${evidence}" >> "${GITHUB_OUTPUT}"

    # Factory公式のdirect binaryをexact version/digestで検証する。standalone updaterは
    # 実行stepでも無効化し、reviewなしのversion driftを許さない。
    - name: Install verified Droid CLI (agent=droid)
      if: ${{ inputs.agent == 'droid' }}
      shell: bash
      env:
        DROID_VERSION: "0.174.0"
        DROID_LINUX_X64_SHA256: "e73592e3c6fc5a754f21b995f27ef686ca0a5096c9a91f2019fb8a3b10a56bbc"
      run: |
        set -euo pipefail
        case "$(uname -s):$(uname -m)" in
          Linux:x86_64) ;;
          *) echo "::error::The pinned Droid artifact supports only the ubuntu-latest Linux x86_64 runner."; exit 1 ;;
        esac
        artifact="${RUNNER_TEMP}/droid-${DROID_VERSION}-linux-x64"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          --output "${artifact}" \
          "https://downloads.factory.ai/factory-cli/releases/${DROID_VERSION}/linux/x64/droid"
        echo "${DROID_LINUX_X64_SHA256}  ${artifact}" | sha256sum -c -
        install -m 0755 "${artifact}" "${RUNNER_TEMP}/droid"
        installed_version="$(FACTORY_DROID_AUTO_UPDATE_ENABLED=false "${RUNNER_TEMP}/droid" --version)"
        if [[ "${installed_version}" != *"${DROID_VERSION}"* ]]; then
          echo "::error::Installed Droid version does not match the reviewed pin."
          exit 1
        fi
        echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

    # P8-T05は構造parityまで。Factory credential、turn-limit enforcement proof、
    # real E2Eが揃うまで、このgateをcode reviewで変更しない限り必ず停止する。
    - name: Require reviewed Droid activation (agent=droid)
      if: ${{ inputs.agent == 'droid' }}
      shell: bash
      env:
        DROID_EXECUTION_ENABLED: "false"
      run: |
        set -euo pipefail
        if [[ "${DROID_EXECUTION_ENABLED}" != "true" ]]; then
          echo "::error::agent=droid remains fail-closed pending FACTORY credential, turn-limit proof, and real ceiling E2E."
          exit 1
        fi

    # This step is intentionally unreachable while DROID_EXECUTION_ENABLED=false above.
    # It records the reviewed invocation contract without claiming a successful Droid run.
    - name: Run bounded Droid (agent=droid)
      id: run_droid
      if: ${{ inputs.agent == 'droid' }}
      shell: bash
      env:
        CODING_INSTRUCTION: ${{ inputs.instruction }}
        DROID_EXECUTION_PROFILE: "droid-litellm-coding"
        MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds }}
        MAX_COST_USD: ${{ inputs.max_cost_usd }}
        MAX_TOKENS: ${{ inputs.max_tokens }}
        MAX_TOOL_CALLS: ${{ inputs.max_tool_calls }}
        LITELLM_BASE_URL: ${{ inputs.litellm_base_url }}
        LITELLM_CODING_VIRTUAL_KEY: ${{ inputs.litellm_coding_virtual_key }}
        FACTORY_DROID_AUTO_UPDATE_ENABLED: "false"
      run: |
        set -euo pipefail
        if [[ -z "${FACTORY_API_KEY:-}" ]]; then
          echo "::error::The reviewed Factory CLI credential gate is not satisfied."
          exit 1
        fi
        if [[ -z "${LITELLM_BASE_URL:-}" ]] || [[ -z "${LITELLM_CODING_VIRTUAL_KEY:-}" ]]; then
          echo "::error::LITELLM_BASE_URL and the scoped LITELLM_CODING_VIRTUAL_KEY are required for agent=droid."
          exit 1
        fi
        if [[ ! "${MAX_RUNTIME_SECONDS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_RUNTIME_SECONDS > 1800 )); then
          echo "::error::max_runtime_seconds must be an integer between 1 and 1800."
          exit 1
        fi
        if ! jq -en --arg value "${MAX_COST_USD}" '$value | tonumber | select(. > 0 and . <= 25)' >/dev/null; then
          echo "::error::max_cost_usd must be a number greater than 0 and at most 25."
          exit 1
        fi
        if [[ ! "${MAX_TOKENS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_TOKENS > 200000 )); then
          echo "::error::max_tokens must be an integer between 1 and 200000."
          exit 1
        fi
        if [[ ! "${MAX_TOOL_CALLS}" =~ ^[1-9][0-9]{0,9}$ ]] || (( MAX_TOOL_CALLS > 500 )); then
          echo "::error::max_tool_calls must be an integer between 1 and 500."
          exit 1
        fi
        current_branch="$(git symbolic-ref --quiet --short HEAD)" || {
          echo "::error::Droid requires a named agent/* branch."
          exit 1
        }
        case "${current_branch}" in
          agent/*) ;;
          *) echo "::error::Droid may run only on an agent/* PR branch."; exit 1 ;;
        esac

        # A temporary HOME excludes personal settings/hooks. The committed template is rendered
        # with the request-scoped LiteLLM route; no provider or master key reaches the runner.
        droid_home="$(mktemp -d "${RUNNER_TEMP}/droid-home.XXXXXX")"
        prompt_file="${RUNNER_TEMP}/droid-prompt-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}.md"
        result_file="${RUNNER_TEMP}/droid-result-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}.json"
        trap 'rm -rf -- "${droid_home}"; rm -f -- "${prompt_file}" "${result_file}"' EXIT
        mkdir -p "${droid_home}/.factory"
        jq -e '
          .cloudSessionSync == false and
          .customModels[0].apiKey == "${LITELLM_CODING_VIRTUAL_KEY}" and
          .maxAutonomyLevel == "low" and
          .mcpPolicy == {"enabled":false,"allowlist":[]} and
          (.commandBlocklist | index("curl") != null) and
          (.commandBlocklist | index("gh") != null) and
          (.commandBlocklist | index("git push") != null) and
          (.commandBlocklist | index("git commit") != null) and
          (.commandBlocklist | index("aws") != null) and
          (.commandBlocklist | index("kubectl") != null) and
          (.commandBlocklist | index("terraform") != null) and
          (.commandBlocklist | index("docker") != null)
        ' .factory/runner-settings.template.json >/dev/null
        jq --arg base_url "${LITELLM_BASE_URL}" \
          '.customModels[0].baseUrl = $base_url
           | .modelPolicy.allowedBaseUrls = [$base_url]' \
          .factory/runner-settings.template.json > "${droid_home}/.factory/settings.json"
        cat .factory/droids/coding-agent.md > "${prompt_file}"
        printf '\n\n## Assigned instruction\n\n%s\n' "${CODING_INSTRUCTION}" >> "${prompt_file}"

        echo "[run-coding-agent] launching profile=${DROID_EXECUTION_PROFILE} branch=${current_branch}"
        # Cost/token limits are enforced by the P8-T03 issuer-side scoped virtual-key budget.
        # Runtime is killed locally. num_turns is rejected post-run; activation additionally
        # requires proof of an early turn-limit mechanism before this gate may be enabled.
        HOME="${droid_home}" \
        timeout --signal=TERM --kill-after=30s "${MAX_RUNTIME_SECONDS}s" \
          droid exec \
          --cwd "${GITHUB_WORKSPACE}" \
          --auto low \
          --model "custom:AIOps-LiteLLM-Coding-0" \
          --disabled-tools "FetchUrl,WebSearch" \
          --output-format json \
          --file "${prompt_file}" > "${result_file}"

        evidence="$(jq -ce \
          --arg profile "${DROID_EXECUTION_PROFILE}" \
          --arg max_turns "${MAX_TOOL_CALLS}" \
          'select(.type == "result" and .subtype == "success" and .is_error == false)
           | select((.num_turns | type) == "number" and .num_turns >= 0 and .num_turns <= ($max_turns | tonumber))
           | .result | fromjson
           | select(.execution_profile == $profile)
           | select((keys | sort) == (["changed_paths","commands_executed","dependency_changes","execution_profile","security_findings","skipped_failed_checks","test_results","unresolved_decisions"] | sort))
           | select((.commands_executed | type) == "array" and all(.commands_executed[];
               (type == "object") and (keys | sort) == ["command","evidence","result"] and
               (.command | type) == "string" and (.evidence | type) == "string" and
               (.result == "pass" or .result == "fail")))
           | select((.test_results | type) == "array" and all(.test_results[];
               (type == "object") and (keys | sort) == ["evidence","result","test"] and
               (.test | type) == "string" and (.evidence | type) == "string" and
               (.result == "pass" or .result == "fail")))
           | select((.skipped_failed_checks | type) == "array" and all(.skipped_failed_checks[]; type == "string"))
           | select((.changed_paths | type) == "array" and all(.changed_paths[]; type == "string"))
           | select((.dependency_changes | type) == "array" and all(.dependency_changes[]; type == "string"))
           | select((.security_findings | type) == "array" and all(.security_findings[]; type == "string"))
           | select((.unresolved_decisions | type) == "array" and all(.unresolved_decisions[]; type == "string"))' "${result_file}")" || {
          echo "::error::Droid did not return valid bounded callback evidence."
          exit 1
        }
        echo "execution_profile=${DROID_EXECUTION_PROFILE}" >> "${GITHUB_OUTPUT}"
        echo "evidence=${evidence}" >> "${GITHUB_OUTPUT}"
