# .github/actions/run-coding-agent/action.yml
#
# 根拠: ADR-0006決定1「実行はcomposite action化し、agentパラメータ（claude-code | droid）で
#   差し替え可能にする」。.github/workflows/coding-task.yml から呼ばれる。
#
# 実行前提: CLIはこのaction内でバージョン固定して導入する。導入ステップが無いと
#   `claude: command not found` で必ず失敗するため、リポジトリの他の依存と同じく
#   exact versionで固定する。
name: "run-coding-agent"
description: "AIコーディングエージェント（Claude Code / Droid）にinstructionを渡して実装させる（ADR-0006）"

inputs:
  agent:
    description: "実行エージェント（claude-code | droid）"
    required: true
  instruction:
    description: "コーディング指示内容（coding_tasks.instruction由来。sanitizeSecrets済みの想定）"
    required: true
  litellm_base_url:
    description: "agent=claude-code 実行用のLiteLLM gateway URL"
    required: false
    default: ""
  litellm_coding_virtual_key:
    description: "agent=claude-code 専用のLiteLLM virtual key。CLI導入ステップには渡さない"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Require LiteLLM gateway credentials (agent=claude-code)
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.litellm_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.litellm_coding_virtual_key }}
      run: |
        set -euo pipefail
        if [ -z "${ANTHROPIC_BASE_URL:-}" ] || [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
          echo "::error::LITELLM_BASE_URL and LITELLM_CODING_VIRTUAL_KEY are required for agent=claude-code."
          exit 1
        fi

    # AGENTS.md「npmコマンドは使用しない」に従い pnpm で導入する。バージョンは
    # リポジトリの他の依存と同様に exact pin し、更新はレビュー付きの明示的なPRで行う。
    # このステップにはgateway資格情報を渡さない: 依存のlifecycle scriptが動く可能性が
    # あるため、virtual keyは実行ステップのenvにのみ展開する。
    - name: Install Claude Code CLI (agent=claude-code)
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        CLAUDE_CODE_VERSION: "2.1.222"
      run: |
        set -euo pipefail
        # pnpm 11 は既定でlifecycle scriptを実行しない。claude-code は postinstall
        # (node install.cjs) でプラットフォーム別バイナリを配置するため、明示的に
        # このパッケージだけbuildを許可する。許可しないと導入できても起動しない。
        pnpm add --global --allow-build=@anthropic-ai/claude-code "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
        claude --version

    - name: Run Claude Code (agent=claude-code)
      if: ${{ inputs.agent == 'claude-code' }}
      shell: bash
      env:
        CODING_INSTRUCTION: ${{ inputs.instruction }}
        ANTHROPIC_BASE_URL: ${{ inputs.litellm_base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.litellm_coding_virtual_key }}
        ANTHROPIC_MODEL: "claude-code"
        ANTHROPIC_SMALL_FAST_MODEL: "claude-code"
      run: |
        set -euo pipefail
        echo "[run-coding-agent] launching claude-code CLI"
        # virtual keyはLiteLLM側でclaude-code aliasだけを許可し、budget上限とexpiryを
        # 必ず設定する。provider credentialはrunnerへ渡さない。
        # --permission-mode acceptEdits はコード編集を自動承認するが、git commit/push・
        # PR作成はcoding-task.yml側のステップが別途行う（AC-002b: 自動マージはしない）。
        # 呼び出し側は checkout の persist-credentials: false と core.hooksPath=/dev/null で
        # 資格情報の残留とフック実行を封じている。
        claude -p "${CODING_INSTRUCTION}" --model "${ANTHROPIC_MODEL}" --permission-mode acceptEdits

    # ADR-0006「影響」節の残課題: Droid実行ステップはFactory側のCI実行方式が
    # 確定するまで有効化しない。動かない経路を動くように見せず、明示的に失敗させる
    # （ADR-0014の「設定不足は無効化して監査し、決して擬似実行しない」に倣う）。
    - name: Run Droid (agent=droid)
      if: ${{ inputs.agent == 'droid' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::error::agent=droid is not enabled yet. ADR-0006 lists the Factory CI execution method as an open item; enable this step only after it is decided and the CLI version can be pinned."
        exit 1
